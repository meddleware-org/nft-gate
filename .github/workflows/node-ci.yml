name: Node CI

# CI for the Cloudflare Workers gateway implementation (gateway-workers).
# The Rust gateway is covered by rust-ci.yml.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  workers-ci:
    name: Workers gateway (gateway-workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test
