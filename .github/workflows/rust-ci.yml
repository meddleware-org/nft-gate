name: Rust CI

# CI for the Rust gateway implementation (gateway-rust) and its Dockerfile scan.
# The Node Workers gateway is covered by node-ci.yml.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-ci:
    name: Rust gateway (gateway-rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "gateway-rust -> target"
          # Only save the cache on main-branch pushes to avoid saturating the
          # GitHub Actions cache upload bandwidth on every PR run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Advisories, licences, bans and sources per deny.toml (supersedes the audit-only check).
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: gateway-rust/Cargo.toml
      # Release build is intentionally omitted: cargo test already verifies
      # compilation. The release binary is built inside the Dockerfile.

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88"
      - name: Check on the declared minimum toolchain
        run: cargo check --locked

  trivy-scan:
    name: Trivy (gateway-rust Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: gateway-rust
          version: v0.74.0
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
