name: Deploy Workers

# Deploys the LIVE NFT-gated relay Worker. Manual only: a deploy can require a coordinated secret
# change (see the walrus runbook), so it never runs on push. The job re-runs the full CI first and
# executes in the protected `production` environment (configure required reviewers in the
# repository settings).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml

  deploy:
    name: Wrangler deploy (gateway-workers)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
