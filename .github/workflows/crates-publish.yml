name: Publish (crates.io)

# Publishes the gateway-rust crate to crates.io on a v* tag, gated on the full Rust CI against the
# exact tagged commit. Uses crates.io trusted publishing (OIDC): no long-lived token. The crates.io
# trusted publisher for nft-gate-gateway must name this repository and this workflow file.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/rust-ci.yml

  publish-crates:
    name: crates.io (gateway-rust)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write # OIDC exchange for a short-lived crates.io token
    defaults:
      run:
        working-directory: gateway-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # The reusable verify workflow (rust-ci.yml) checks npm == crate == tag (D16).
      - name: Check if already published
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: github-actions/nft-gate" \
            "https://crates.io/api/v1/crates/nft-gate-gateway/$VERSION")
          if [ "$HTTP" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION already on crates.io — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Obtain a crates.io token (trusted publishing)
        if: steps.check.outputs.skip == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.check.outputs.skip == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
